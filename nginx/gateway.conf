# Public gateway for the /swarm deployment. TLS terminates upstream.
server {
    listen 8081;
    absolute_redirect off;
    client_max_body_size 500m;  # images ~5 MB, videos potentially hundreds of MB

    # Optional deployment-specific routes are kept outside version control.
    include /etc/nginx/swarm-local/*.conf;

    location = /swarm {
        return 308 /swarm/;
    }

    # Serve agent scripts before the /swarm/ rewrite so the longest-prefix
    # match fires here rather than falling into the rewrite → location / loop.
    location /swarm/agent/ {
        alias /srv/agent/;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Strip the deployment prefix before routing API, downloads, and UI.
    location /swarm/ {
        rewrite ^/swarm/(.*)$ /$1 last;
    }

    location / {
        proxy_pass http://ui:8082;
        proxy_set_header Host $host;
    }

    location = /agent/agent.ps1 {
        alias /srv/agent/agent.ps1;
    }
    location = /agent/agent.py {
        alias /srv/agent/agent.py;
        add_header Content-Type "text/plain; charset=utf-8";
    }
    location = /agent/container_agent.py {
        alias /srv/agent/container_agent.py;
        add_header Content-Type "text/plain; charset=utf-8";
    }
    server_name _;

    # Strip /api prefix and forward to coordinator
    location /api/ {
        proxy_pass         http://coordinator:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3660s;  # allow the 3600s outbound-relay model loading trial

        # Required for SSE streaming (chat completions)
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Handle /api (no trailing slash)
    location = /api {
        proxy_pass         http://coordinator:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Health check (no auth) — useful for uptime monitors
    location = /healthz {
        proxy_pass http://coordinator:8080/healthz;
    }

    # Self-hosted Ollama installer mirror — agents prefer this over ollama.com
    # Populate with: make ollama-mirror
    location /ollama/ {
        alias /srv/ollama/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }
}
