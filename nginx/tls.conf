# TLS termination for the coordinator API.
# Self-signed cert is generated on first run by the certgen service.
# Agents connect to :8443 with SkipCertificateCheck (traffic is still encrypted).

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Forward everything to the coordinator on the internal network
    location / {
        proxy_pass         http://coordinator:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 180s;

        # Needed for SSE streaming (chat completions)
        proxy_buffering    off;
        proxy_cache        off;
    }
}
